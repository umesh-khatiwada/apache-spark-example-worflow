apiVersion: v1
kind: Pod
metadata:
  name: test-pvc-canary
  namespace: spark
spec:
  restartPolicy: Never
  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: spark-shared-pvc
  containers:
    - name: test-canary
      image: busybox:latest
      command: ["sh", "-c"]
      args:
        - |
          echo "=== Step 1: Checking data/raw files ==="
          ls -la /opt/spark/work-dir/data/raw
          echo "=== Step 2: Testing write access ==="
          echo "canary-write-from-k8s-pod: $(date)" > /opt/spark/work-dir/data/warehouse/canary_k8s.txt
          echo "=== Step 3: Verifying canary file ==="
          cat /opt/spark/work-dir/data/warehouse/canary_k8s.txt
          echo "=== PVC VERIFICATION PASSED ==="
      volumeMounts:
        - name: shared-storage
          mountPath: /opt/spark/work-dir
